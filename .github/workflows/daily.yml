name: Daily recrawl (pilot towns)

# Fresh agendas and hearing notices for the town records pilot, so calendars and town pages stay within a day.
# Crawls only the towns listed in civic.json ("towns"), with a short look-back. The Monday weekly job covers
# every town; this job skips Monday and shares its concurrency group, so the two never touch the database at once.
on:
  schedule:
    - cron: "30 10 * * 0,2-6"   # 10:30 UTC (05:30/06:30 Eastern), every day but Monday
  workflow_dispatch:
    inputs:
      since_days:
        description: "Only fetch documents dated within this many days"
        default: "30"
      towns:
        description: "Comma-separated towns (blank = civic.json towns)"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-recrawl
  cancel-in-progress: false

jobs:
  recrawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml pymupdf openpyxl psutil
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Restore database
        run: gh release download data -p nh_meetings.db.gz && gunzip -f nh_meetings.db.gz

      - name: Pick towns
        id: towns
        env:
          TOWNS_INPUT: ${{ inputs.towns }}
        run: |
          if [ -n "$TOWNS_INPUT" ]; then t="$TOWNS_INPUT"; else t=$(python -c "import json;print(','.join(json.load(open('civic.json'))['towns']))"); fi
          echo "list=$t" >> "$GITHUB_OUTPUT"
          echo "Crawling: $t"

      - name: Crawl
        run: python nhmeet.py crawl --towns "${{ steps.towns.outputs.list }}" --since-days "${{ inputs.since_days || '30' }}" --workers 10 --max-minutes 60

      - name: OCR scanned PDFs
        run: timeout 15m python ocr.py --workers 4 || echo "OCR stopped at time limit; the rest carries to the next run"

      - name: Keyword report and site
        run: |
          python report.py
          python site.py

      - name: Save database
        if: always()
        run: |
          [ -f nh_meetings.db ] || exit 0
          sqlite3 nh_meetings.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          gzip -kf nh_meetings.db
          gh release upload data nh_meetings.db.gz --clobber

      - name: Bundle new original files for the PC archive
        if: always()
        run: |
          [ -d raw ] && [ -n "$(ls -A raw)" ] || exit 0
          tag=raw-$(date -u +%Y%m%d)-daily
          tar -cf - raw | split -b 1900m -d - "$tag.tar.part"
          gh release upload raw-archive $tag.tar.part* --clobber

      - name: Publish
        run: |
          git config user.name "granite-docket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs hits.csv
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Daily update $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
