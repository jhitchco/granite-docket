<title>NH Meeting Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: records-office docket. Summary strip, filter bar, town ledger + hit cards, coverage register at the end. */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#18201d; --muted:#5d6a64; --rule:#dde2de;
  --accent:#1f5c4a; --accent-soft:#e3efe9;
  --nuc:#9a5b00; --nuc-soft:#fbefd9; --dc:#1d5aa6; --dc-soft:#e2ecf8;
  --warn:#a33a2a; --mark:#ffe28a; --mark-ink:#18201d;
  --f-display:"Public Sans",system-ui,sans-serif; --f-body:"Public Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#18201d; --ink:#e6ebe8; --muted:#97a59e; --rule:#2b3531;
  --accent:#6cc3a3; --accent-soft:#1d3029; --nuc:#f0b45a; --nuc-soft:#33270f; --dc:#80b4f2; --dc-soft:#16253a;
  --warn:#f08b7a; --mark:#7a6312; --mark-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#18201d; --ink:#e6ebe8; --muted:#97a59e; --rule:#2b3531;
  --accent:#6cc3a3; --accent-soft:#1d3029; --nuc:#f0b45a; --nuc-soft:#33270f; --dc:#80b4f2; --dc-soft:#16253a;
  --warn:#f08b7a; --mark:#7a6312; --mark-ink:#fff6d6; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header h1{font:800 clamp(26px,4vw,36px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;font-variant-numeric:tabular-nums}
.stat b{display:block;font:800 24px var(--f-display)}
.stat span{font:12px var(--f-mono);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.filters label{display:grid;gap:4px;font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;min-width:0}
input[type=search]{width:min(260px,70vw)}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cols{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.ledger{background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.ledger h2,.sec h2{font:800 13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin:0;padding:12px 14px;border-bottom:1px solid var(--rule)}
.ledger ol{list-style:none;margin:0;padding:0;max-height:70vh;overflow:auto}
.ledger li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:8px 14px;border-bottom:1px solid var(--rule);cursor:pointer;font-variant-numeric:tabular-nums}
.ledger li button:hover,.ledger li button[aria-pressed=true]{background:var(--accent-soft)}
.ledger small{font:11px var(--f-mono);color:var(--muted)}
.chip{font:500 11px var(--f-mono);padding:2px 7px;border-radius:999px;white-space:nowrap}
.chip.nuclear{background:var(--nuc-soft);color:var(--nuc)}
.chip.data_center{background:var(--dc-soft);color:var(--dc)}
.hits{display:grid;gap:12px;min-width:0}
.hit{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.hit .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.hit .town{font:800 17px var(--f-display)}
.meta{font:12px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.hit a.title{color:var(--accent);word-break:break-word;font-weight:600;text-decoration:none}
.hit a.title:hover{text-decoration:underline}
.snip{font:13px/1.55 var(--f-mono);color:var(--muted);border-left:2px solid var(--rule);padding-left:10px;overflow-wrap:anywhere}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
.score{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.more{font:12px var(--f-mono);background:none;border:0;color:var(--accent);cursor:pointer;padding:0;justify-self:start}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--rule);border-radius:6px}
.sec{background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.sec p{margin:0;padding:10px 14px;color:var(--muted)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.st{font:11px var(--f-mono);padding:1px 6px;border-radius:3px}
.st.done{background:var(--accent-soft);color:var(--accent)}
.st.gap{background:var(--nuc-soft);color:var(--warn)}
.pager{display:flex;gap:10px;align-items:center;font:12px var(--f-mono);color:var(--muted)}
.pager button{font:12px var(--f-mono);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">New Hampshire · municipal meeting records</div>
    <h1>NH Meeting Watch</h1>
    <p id="sub"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <label for="f-topic">Topic<select id="f-topic"></select></label>
    <label for="f-county">County<select id="f-county"></select></label>
    <label for="f-board">Board<select id="f-board"></select></label>
    <label for="f-type">Document<select id="f-type"></select></label>
    <label for="f-sort">Sort<select id="f-sort"><option value="score">Strongest match</option><option value="date">Newest meeting</option></select></label>
    <label for="f-q">Find in snippets<input id="f-q" type="search" placeholder="e.g. moratorium, Route 3"></label>
  </div>
  <div class="cols">
    <aside class="ledger"><h2>Towns with matches</h2><ol id="ledger"></ol></aside>
    <section class="hits" id="hits" aria-live="polite"></section>
  </div>
  <section class="sec" id="fbsec" hidden>
    <h2>Uncrawled towns: web-search findings</h2>
    <p id="fbnote"></p>
    <div class="hits" id="fb" style="padding:0 14px 14px"></div>
  </section>
  <section class="sec">
    <h2>Coverage register</h2>
    <p id="covnote"></p>
    <div class="tablebox"><table><thead><tr><th>Town</th><th>County</th><th>Pop. 2020</th><th>Status</th><th>Docs</th><th>Note</th></tr></thead><tbody id="cov"></tbody></table></div>
  </section>
</div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BOARD = {planning:"Planning board",zoning:"Zoning / ZBA",select_board:"Select board / council",town_meeting:"Town meeting / warrant",conservation:"Conservation",energy:"Energy committee",economic_dev:"Economic development",budget:"Budget / CIP",heritage_historic:"Historic",school:"School",other:"Other / unclassified"};
const STATUS = {done:"Crawled",blocked_bot_challenge:"Bot challenge",robots_disallowed:"robots.txt blocks",no_website:"No website",unreachable:"Unreachable",error:"Error",crawling:"Partial"};
let townSel = null, page = 0; const PER = 40;

function opts(el, pairs){ el.innerHTML = pairs.map(([v,l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(""); }
function init(){
  const t = D.totals;
  $("#sub").textContent = `Agendas, minutes, packets and warrants posted by NH towns and cities, scanned for ${Object.values(D.topics).join(" and ").toLowerCase()}. Generated ${D.generated}.`;
  const towns = new Set(D.hits.map(h => h.town));
  const done = D.coverage.filter(c => c.status === "done").length;
  $("#stats").innerHTML = [[t.docs?.toLocaleString(), "documents collected"],[done + " / " + D.coverage.length, "municipalities crawled"],[D.hits.length.toLocaleString(), "matching documents"],[towns.size, "towns with matches"],[(t.min_date||"?") + " → " + (t.max_date||"?"), "meeting dates"]]
    .map(([b,s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  opts($("#f-topic"), [["","All topics"], ...Object.entries(D.topics)]);
  opts($("#f-county"), [["","All counties"], ...[...new Set(D.coverage.map(c => c.county).filter(Boolean))].sort().map(c => [c,c])]);
  opts($("#f-board"), [["","All boards"], ...Object.entries(BOARD)]);
  opts($("#f-type"), [["","All documents"],["agenda","Agendas & packets"],["minutes","Minutes"],["warrant","Warrants"],["notice","Notices"],["other","Other"]]);
  ["#f-topic","#f-county","#f-board","#f-type","#f-sort"].forEach(s => $(s).addEventListener("change", () => { page = 0; render(); }));
  $("#f-q").addEventListener("input", () => { page = 0; render(); });
  coverage(); fallback(); render();
}
function fallback(){
  const f = D.fallback || {findings:[], searched_towns:[]};
  if (!f.searched_towns.length) return;
  $("#fbsec").hidden = false;
  $("#fbnote").textContent = `${f.searched_towns.length} towns the crawler could not reach were checked through search engines and news instead. These summaries are secondhand, so open the source before relying on one.`;
  $("#fb").innerHTML = f.findings.length ? [...f.findings].sort((a,b) => (b.date||"").localeCompare(a.date||"")).map(x => `<article class="hit">
    <div class="top"><span class="town">${esc(x.town)}</span><span class="chip ${esc(x.topic)}">${esc(D.topics[x.topic]||x.topic)}</span></div>
    <div class="meta"><span>${esc(x.date||"date unknown")}</span><span>${esc(BOARD[x.board]||x.board||"")}</span><span>${esc(x.source_type||"")}</span></div>
    <a class="title" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||x.url)}</a>
    <div class="snip">${esc(x.summary)}</div></article>`).join("") : `<div class="empty">No matches turned up for these towns.</div>`;
}
function filtered(){
  const tp = $("#f-topic").value, co = $("#f-county").value, bo = $("#f-board").value, ty = $("#f-type").value, q = $("#f-q").value.trim().toLowerCase();
  return D.hits.filter(h => (!tp || h.topic === tp) && (!co || h.county === co) && (!bo || h.board === bo) && (!ty || h.type === ty)
    && (!q || h.snippets.some(s => (s.pre + s.hit + s.post).toLowerCase().includes(q)) || (q && (h.title||"").toLowerCase().includes(q))));
}
function render(){
  const rows = filtered();
  const byTown = {};
  rows.forEach(h => { const b = byTown[h.town] ||= {n:0, nuclear:0, data_center:0, max:0}; b.n++; b[h.topic] = (b[h.topic]||0)+1; b.max = Math.max(b.max, h.score); });
  const order = Object.entries(byTown).sort((a,b) => b[1].max - a[1].max);
  $("#ledger").innerHTML = order.length ? order.map(([town,b]) => `<li><button type="button" aria-pressed="${townSel===town}" data-town="${esc(town)}"><span>${esc(town)}</span>${b.nuclear?`<span class="chip nuclear">${b.nuclear}</span>`:"<span></span>"}${b.data_center?`<span class="chip data_center">${b.data_center}</span>`:"<span></span>"}</button></li>`).join("")
    : `<li><small style="display:block;padding:12px 14px">No towns match these filters.</small></li>`;
  document.querySelectorAll("#ledger button").forEach(b => b.onclick = () => { townSel = townSel === b.dataset.town ? null : b.dataset.town; page = 0; render(); });
  let list = townSel ? rows.filter(h => h.town === townSel) : rows;
  list = [...list].sort($("#f-sort").value === "date" ? (a,b) => (b.date||"").localeCompare(a.date||"") : (a,b) => b.score - a.score);
  const slice = list.slice(page*PER, page*PER+PER);
  const pages = Math.ceil(list.length / PER);
  $("#hits").innerHTML = (slice.length ? slice.map(card).join("") : `<div class="empty">No documents match. Clear a filter or pick another town.</div>`)
    + (pages > 1 ? `<div class="pager"><button type="button" id="prev" ${page?"":"disabled"}>Previous</button><span>Page ${page+1} of ${pages} · ${list.length} documents${townSel?" in "+esc(townSel):""}</span><button type="button" id="next" ${page<pages-1?"":"disabled"}>Next</button></div>` : "");
  $("#prev")?.addEventListener("click", () => { page--; render(); window.scrollTo({top: $("#hits").offsetTop - 20}); });
  $("#next")?.addEventListener("click", () => { page++; render(); window.scrollTo({top: $("#hits").offsetTop - 20}); });
  document.querySelectorAll(".more").forEach(b => b.onclick = () => { b.previousElementSibling.hidden = false; b.remove(); });
}
function snip(s){ return `<div class="snip">…${esc(s.pre)}<mark>${esc(s.hit)}</mark>${esc(s.post)}…</div>`; }
function card(h){
  const first = h.snippets.slice(0,2).map(snip).join(""), rest = h.snippets.slice(2);
  return `<article class="hit">
    <div class="top"><span class="town">${esc(h.town)}</span><span class="chip ${h.topic}">${esc(D.topics[h.topic])}</span><span class="score">${h.n} mention${h.n==1?"":"s"} · score ${h.score}</span></div>
    <div class="meta"><span>${esc(h.date || "date unknown")}</span><span>${esc(BOARD[h.board]||h.board)}</span><span>${esc(h.type)}</span><span>${esc(h.county||"")} County</span>${h.z?`<span>zoning context ×${h.z}</span>`:""}</div>
    <a class="title" href="${esc(h.url)}" target="_blank" rel="noopener">${esc((h.title||"").replace(/\s*\|\s*/g," · ").slice(0,160) || h.url)}</a>
    <div class="meta"><span>Terms: ${esc(h.terms)}</span></div>
    ${first}${rest.length?`<div hidden>${rest.map(snip).join("")}</div><button type="button" class="more">Show ${rest.length} more excerpt${rest.length>1?"s":""}</button>`:""}
  </article>`;
}
function coverage(){
  const gaps = D.coverage.filter(c => c.status !== "done");
  $("#covnote").textContent = `${gaps.length} municipalities could not be crawled automatically: their sites sit behind a bot challenge, ask crawlers to stay out in robots.txt, render only with JavaScript, or have no website. Search them by hand or ask the town clerk.`;
  const rank = c => c.status === "done" ? 1 : 0;
  $("#cov").innerHTML = [...D.coverage].sort((a,b) => rank(a)-rank(b) || (b.pop||0)-(a.pop||0)).map(c =>
    `<tr><td>${c.site?`<a href="${esc(c.site)}" target="_blank" rel="noopener">${esc(c.town)}</a>`:esc(c.town)}</td><td>${esc(c.county)}</td><td>${(c.pop||0).toLocaleString()}</td><td><span class="st ${c.status==="done"?"done":"gap"}">${esc(STATUS[c.status]||c.status)}</span></td><td>${c.docs??""}</td><td>${esc(c.notes||"")}</td></tr>`).join("");
}
init();
</script>
